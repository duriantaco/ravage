<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <div class="site-shell">
      <aside class="sidebar">
        {% include site-nav.html nav_id_prefix="sidebar-nav" %}
      </aside>

      <div class="page-shell">
        <header class="mobile-header">
          <a class="mobile-brand" href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/ravage_logo.png' | relative_url }}" alt="" width="34" height="34">
            <span>Ravage Docs</span>
          </a>
          <details class="mobile-menu">
            <summary>Menu</summary>
            {% include site-nav.html nav_id_prefix="mobile-nav" %}
          </details>
        </header>

        <main id="content" class="content" tabindex="-1">
          {{ content }}
        </main>

        <footer class="site-footer">
          <span>{{ site.description }}</span>
          <a href="https://github.com/duriantaco/ravage">View repository</a>
        </footer>
      </div>
    </div>
  </body>
</html>
