# Virtual workspace: build and install the two real packages, never a second
# root distribution containing duplicate imports or a duplicate ravage command.
[tool.uv.workspace]
members = [
    "packages/ravage",
    "packages/schemas",
]
# These directories contain unimplemented scaffolds, not supported MCP servers.
exclude = ["packages/mcp_servers/*"]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "integration: tests that require Docker or external services",
]
pythonpath = [
    ".",
    "packages/ravage/src",
    "packages/schemas/src",
]
testpaths = [
    "packages/schemas/tests",
    "packages/ravage/tests",
    "tests",
]
