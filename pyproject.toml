[project]
name = "pentest-agent"
version = "0.5.0"
description = "Ravage source checkout workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=14.1",
]
license = "Apache-2.0"

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[project.scripts]
ravage = "ravage.__main__:main"

[tool.uv.workspace]
members = [
    "packages/ravage",
    "packages/schemas",
    "packages/mcp_servers/*",
]

[tool.setuptools.packages.find]
where = [
    "packages/ravage/src",
    "packages/schemas/src",
]
include = [
    "ravage*",
    "pentest_schemas*",
]

[dependency-groups]
dev = [
    "cryptography>=42.0",
    "mypy>=1.10",
    "pydantic>=2.8",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "integration: tests that require Docker or external services",
]
pythonpath = [
    ".",
    "packages/ravage/src",
    "packages/schemas/src",
]
testpaths = [
    "packages/schemas/tests",
    "packages/ravage/tests",
    "tests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
