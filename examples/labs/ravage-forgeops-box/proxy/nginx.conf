events {}

http {
  upstream forgeops_web {
    server web:8080;
  }

  server {
    listen 80;
    server_name _;

    add_header X-ForgeOps-Lab "local-only" always;

    location / {
      proxy_pass http://forgeops_web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
    }
  }
}
