engagement_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
scope:
  in_scope:
    - "http://127.0.0.1:8088"
  out_of_scope: []
roe:
  max_rps: 5
  no_destructive_actions: true
  data_handling: "placeholders_only"
objectives:
  - "capture_flag"
budget:
  max_cost_usd: 5.0
  max_runtime_min: 30
authentication:
  identities:
    - alias: analyst
      roles:
        - user
      flow:
        kind: form
        endpoint:
          url: "http://127.0.0.1:8088/login"
          scope: target
        secret_refs:
          username:
            provider: environment
            key: RAVAGE_ACME_USERNAME
          password:
            provider: environment
            key: RAVAGE_ACME_PASSWORD
      health_check:
        endpoint:
          url: "http://127.0.0.1:8088/api/me"
          scope: target
        method: GET
        success_statuses:
          - 200
        authenticated_marker: '"username": "analyst"'
        unauthenticated_marker: "authentication required"
        follow_redirects: false
context:
  description: >-
    Authorized authenticated assessment of the local Acme Support Portal using
    its seeded low-privilege analyst account.
  lab: ravage-acme-box
  name: Acme Support Portal
  difficulty: medium
  warning: Deliberately vulnerable local training target. Do not deploy it.
  flag_format: "flag{...}"
  win_condition: Capture as many lab flags as possible from live target evidence.
  allowed_ssrf_hosts:
    - internal
  optional_capabilities:
    - web_fingerprint
    - crawl
    - dir_bruteforce
  rules:
    - Stay on the localhost origin in scope.
    - Capture flags only after a tool observation reveals them.
    - Do not use source code as proof during a black-box run.
    - Non-destructive probes only.
