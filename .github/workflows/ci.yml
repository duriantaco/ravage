name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static_checks:
    name: Scoped static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mypy==2.1.0 \
            pydantic==2.13.4 \
            pytest==9.0.3 \
            pytest-asyncio==1.3.0 \
            pyyaml==6.0.3 \
            ruff==0.15.14
          python -m pip install -e packages/schemas -e packages/ravage

      - name: Check release metadata
        run: python scripts/check_release.py

      - name: Check maintained documentation
        run: python scripts/check_docs.py

      - name: Check cockpit JavaScript syntax
        run: npm --prefix packages/ravage-cockpit run check

      - name: Ruff clean baseline
        run: |
          python -m ruff check \
            packages/schemas/src \
            packages/schemas/tests \
            packages/ravage/src/ravage/competitor_harness.py \
            packages/ravage/src/ravage/self_adapter.py \
            packages/ravage/tests/test_competitor_harness.py

      - name: Repository Python syntax
        run: python -m ruff check --select E9 .

      - name: Ruff changed-file safety
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            diff_range="${base_sha}...HEAD"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            diff_range="${base_sha}..HEAD"
          fi
          changed_python=()
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            while IFS= read -r path; do
              changed_python+=("${path}")
            done < <(git ls-files -- '*.py')
          else
            while IFS= read -r path; do
              changed_python+=("${path}")
            done < <(git diff --name-only --diff-filter=ACMR "${diff_range}" -- '*.py')
          fi
          if [ "${#changed_python[@]}" -eq 0 ]; then
            echo "No changed Python files."
            exit 0
          fi
          python -m ruff check --select E9,F "${changed_python[@]}"

      - name: Mypy schemas
        env:
          MYPYPATH: packages/schemas/src
        run: python -m mypy packages/schemas/src packages/schemas/tests

      - name: Traffic capture and replay static checks
        run: |
          python -m ruff check packages/ravage/src/ravage/traffic
          python -m mypy packages/ravage/src/ravage/traffic

      - name: Public control-plane contract static checks
        run: |
          python -m ruff check \
            packages/ravage/src/ravage/control_plane \
            packages/ravage/tests/test_control_plane_authorization_contracts.py \
            packages/ravage/tests/test_control_plane_runner_protocol.py \
            packages/ravage/tests/test_runner_service.py
          python -m mypy \
            packages/ravage/src/ravage/control_plane \
            packages/ravage/tests/test_control_plane_authorization_contracts.py \
            packages/ravage/tests/test_control_plane_runner_protocol.py \
            packages/ravage/tests/test_runner_service.py

      - name: Anti-overfit policy check
        run: python scripts/check_overfit.py

      - name: Raw secret scan
        run: |
          secret_pattern='sk''-proj-|BEGIN (RSA|OPENSSH|PRIVATE) ''KEY'
          if git grep -nE "${secret_pattern}" -- .; then
            echo "Potential raw secret found."
            exit 1
          else
            grep_status=$?
            if [ "${grep_status}" -ne 1 ]; then
              exit "${grep_status}"
            fi
          fi

  tests:
    name: Full non-integration suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0
          python -m pip install -e packages/schemas -e packages/ravage

      - name: Run all tests that do not require external services
        run: python -m pytest -m "not integration" -q

  clean_install:
    name: Clean wheel install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Smoke-test the base wheels in a clean environment
        run: python scripts/check_clean_install.py

  scope_integration:
    name: Docker scope enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0
          python -m pip install -e packages/schemas -e packages/ravage

      - name: Enforce scoped Docker egress
        env:
          RAVAGE_REQUIRE_DOCKER_INTEGRATION: "1"
        run: python -m pytest -m integration -q

  fast_checks:
    name: Fast checks
    if: ${{ always() }}
    needs:
      - static_checks
      - tests
      - clean_install
      - scope_integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression gate
        env:
          STATIC_RESULT: ${{ needs.static_checks.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CLEAN_INSTALL_RESULT: ${{ needs.clean_install.result }}
          SCOPE_INTEGRATION_RESULT: ${{ needs.scope_integration.result }}
        run: |
          test "${STATIC_RESULT}" = success
          test "${TEST_RESULT}" = success
          test "${CLEAN_INSTALL_RESULT}" = success
          test "${SCOPE_INTEGRATION_RESULT}" = success
