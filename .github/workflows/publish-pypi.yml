name: Publish PyPI Packages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release build
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'release' && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the peeled release tag to equal current main
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          event_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse --verify "refs/remotes/origin/main^{commit}")"
          if [ "${event_commit}" != "${release_commit}" ]; then
            echo "Release event commit ${event_commit} is not peeled tag commit ${release_commit}." >&2
            exit 1
          fi
          if [ "${release_commit}" != "${main_commit}" ]; then
            echo "Release tag commit ${release_commit} is not current main ${main_commit}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check release metadata
        run: python scripts/check_release.py

      - name: Refuse occupied PyPI versions
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: python scripts/check_pypi_version.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mypy==2.1.0 \
            pydantic==2.13.4 \
            pytest==9.0.3 \
            pytest-asyncio==1.3.0 \
            pyyaml==6.0.3 \
            ruff==0.15.14
          python -m pip install -e packages/schemas -e packages/ravage

      - name: Check maintained documentation
        run: python scripts/check_docs.py

      - name: Check cockpit JavaScript
        run: |
          npm --prefix packages/ravage-cockpit run check
          npm --prefix packages/ravage-cockpit test

      - name: Ruff clean baseline
        run: |
          python -m ruff check \
            packages/schemas/src \
            packages/schemas/tests \
            packages/ravage/src/ravage/competitor_harness.py \
            packages/ravage/src/ravage/self_adapter.py \
            packages/ravage/tests/test_competitor_harness.py

      - name: Repository Python syntax
        run: python -m ruff check --select E9 .

      - name: Mypy schemas
        env:
          MYPYPATH: packages/schemas/src
        run: python -m mypy packages/schemas/src packages/schemas/tests

      - name: Traffic capture and replay static checks
        run: |
          python -m ruff check packages/ravage/src/ravage/traffic
          python -m mypy packages/ravage/src/ravage/traffic

      - name: Public control-plane contract static checks
        run: |
          python -m ruff check \
            packages/ravage/src/ravage/control_plane \
            packages/ravage/tests/test_control_plane_authorization_contracts.py \
            packages/ravage/tests/test_control_plane_runner_protocol.py \
            packages/ravage/tests/test_runner_service.py
          python -m mypy \
            packages/ravage/src/ravage/control_plane \
            packages/ravage/tests/test_control_plane_authorization_contracts.py \
            packages/ravage/tests/test_control_plane_runner_protocol.py \
            packages/ravage/tests/test_runner_service.py

      - name: Evidence and operator integrity static checks
        run: |
          python -m ruff check \
            packages/ravage/src/ravage/report.py \
            packages/ravage/src/ravage/report_artifact.py \
            packages/ravage/src/ravage/report_io.py \
            packages/ravage/src/ravage/memory_eval.py \
            packages/ravage/src/ravage/proof_bundle_eval.py \
            packages/ravage/src/ravage/live_dashboard_security.py \
            scripts/eval/run_memory_eval.py \
            scripts/eval/eval_proof_bundles.py
          python -m mypy --follow-imports=silent \
            packages/ravage/src/ravage/report.py \
            packages/ravage/src/ravage/report_artifact.py \
            packages/ravage/src/ravage/report_io.py \
            packages/ravage/src/ravage/memory_eval.py \
            packages/ravage/src/ravage/proof_bundle_eval.py \
            packages/ravage/src/ravage/live_dashboard_security.py \
            scripts/eval/run_memory_eval.py \
            scripts/eval/eval_proof_bundles.py

      - name: Check anti-overfit policy
        run: python scripts/check_overfit.py

      - name: Scan for raw secrets
        run: |
          secret_pattern='sk''-proj-|BEGIN (RSA|OPENSSH|PRIVATE) ''KEY'
          if git grep -nE "${secret_pattern}" -- .; then
            echo "Potential raw secret found."
            exit 1
          else
            grep_status=$?
            if [ "${grep_status}" -ne 1 ]; then
              exit "${grep_status}"
            fi
          fi

      - name: Smoke-test a clean base wheel install
        run: python scripts/check_clean_install.py

      - name: Run the full non-integration suite
        run: python -m pytest -m "not integration" -q

      - name: Enforce scoped Docker egress
        env:
          RAVAGE_REQUIRE_DOCKER_INTEGRATION: "1"
        run: python -m pytest -m integration -q

      - name: Install cockpit browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium firefox

      - name: Verify private cockpit access in real browsers
        run: python -m pytest packages/ravage-cockpit/tests/test_browser_login.py -q

  build-schemas:
    name: Build ravage-schemas
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install build==1.6.0 hatchling==1.32.0 twine==7.0.0
          python -m build --no-isolation packages/schemas --outdir dist/schemas
          python -m twine check dist/schemas/*
          python -m pip hash dist/schemas/*

      - name: Upload ravage-schemas artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ravage-schemas-dist
          path: dist/schemas/*
          if-no-files-found: error

  build-ravage:
    name: Build ravage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install build==1.6.0 hatchling==1.32.0 twine==7.0.0
          python -m build --no-isolation packages/ravage --outdir dist/ravage
          python -m twine check dist/ravage/*

      - name: Verify wheel contract surface
        run: |
          python -m pip install packages/schemas dist/ravage/*.whl
          python - <<'PY'
          import importlib
          from pathlib import Path

          import ravage

          modules = (
              "authorization_attestation",
              "authorization_codec",
              "authorization_contracts",
              "authorization_state",
              "identity",
              "runner_protocol",
              "runner_service",
          )
          for module in modules:
              importlib.import_module(f"ravage.control_plane.{module}")
          assert (Path(ravage.__file__).parent / "py.typed").is_file()
          PY
          python -m pip hash dist/ravage/*

      - name: Upload ravage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ravage-dist
          path: dist/ravage/*
          if-no-files-found: error

  publish-schemas:
    name: Publish ravage-schemas to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-schemas
      - build-ravage
    if: github.event_name == 'release' && github.event.release.prerelease == false
    environment: pypi
    permissions:
      id-token: write # Mint the short-lived production PyPI credential.
    steps:
      - name: Download ravage-schemas artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ravage-schemas-dist
          path: dist/schemas

      - name: Publish ravage-schemas
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/schemas

  publish-ravage:
    name: Publish ravage to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-ravage
      - publish-schemas
    if: github.event_name == 'release' && github.event.release.prerelease == false
    environment: pypi
    permissions:
      id-token: write # Mint the short-lived production PyPI credential.
    steps:
      - name: Download ravage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ravage-dist
          path: dist/ravage

      - name: Publish ravage
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/ravage
