name: Paired XBEN public ledger

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact lowercase campaign identifier from commitment.json
        required: true
        type: string
      phase:
        description: One create-only public ledger phase
        required: true
        type: choice
        options:
          - commitment
          - matrix
          - start
          - results
      source_run_id:
        description: Run ID containing the frozen submission artifact
        required: true
        type: string
      source_artifact_name:
        description: Exact Actions artifact name containing submission.json and payload/
        required: true
        type: string
      submission_file_sha256:
        description: sha256-prefixed digest of the exact submission.json bytes
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: paired-xben-ledger-${{ inputs.campaign_id }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  publish:
    name: Reserve, sign, and immutably publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact signing workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed until trusted protocol verifiers are provisioned
        run: |
          echo "Public-ledger publication is disabled: trusted external protocol verifiers are not provisioned on this runner." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install the pinned official Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Require a source-bound first-attempt repository intake run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          case "${SOURCE_RUN_ID}" in
            ''|*[!0-9]*) echo "source_run_id must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "${SOURCE_ARTIFACT_NAME}" != "paired-xben-submission-${SOURCE_RUN_ID}" ]; then
            echo "Source artifact name is not canonical for its intake run." >&2
            exit 1
          fi
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            >"${RUNNER_TEMP}/source-run.json"
          jq -e --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "paired-xben-intake/${CAMPAIGN_ID}-${PHASE}" \
            '.path == ".github/workflows/paired-xben-intake.yml"
             and .event == "push"
             and .status == "completed"
             and .conclusion == "success"
             and .run_attempt == 1
             and .head_branch == $branch
             and .head_repository.full_name == $repository' \
            "${RUNNER_TEMP}/source-run.json" >/dev/null
          SOURCE_HEAD_SHA="$(jq -er '.head_sha' "${RUNNER_TEMP}/source-run.json")"
          case "${SOURCE_HEAD_SHA}" in
            *[!0-9a-f]*|'') echo "source run head SHA is invalid" >&2; exit 1 ;;
          esac
          if [ "${#SOURCE_HEAD_SHA}" -ne 40 ] && [ "${#SOURCE_HEAD_SHA}" -ne 64 ]; then
            echo "source run head SHA is invalid" >&2
            exit 1
          fi
          gh api --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/paired-xben-intake.yml" \
            -f ref="${SOURCE_HEAD_SHA}" >"${RUNNER_TEMP}/source-intake-workflow.json"
          jq -er '.type == "file" and .encoding == "base64"' \
            "${RUNNER_TEMP}/source-intake-workflow.json" >/dev/null
          jq -r '.content' "${RUNNER_TEMP}/source-intake-workflow.json" \
            | base64 --decode >"${RUNNER_TEMP}/source-intake-workflow.yml"
          cmp -s .github/workflows/paired-xben-intake.yml \
            "${RUNNER_TEMP}/source-intake-workflow.yml"
          echo "head_sha=${SOURCE_HEAD_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Download the exact frozen submission
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.source_artifact_name }}
          path: ${{ runner.temp }}/submission
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the submission before reserving its permanent path
        id: validate
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          PHASE: ${{ inputs.phase }}
          SUBMISSION_SHA256: ${{ inputs.submission_file_sha256 }}
          SUBMISSION_ROOT: ${{ runner.temp }}/submission
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Only refs/heads/main may request the frozen signing identity." >&2
            exit 1
          fi
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Workflow reruns are forbidden; publish a new campaign after a failed attempt." >&2
            exit 1
          fi
          python -m tools.paired_xben.public_ledger validate-submission \
            --submission-dir "${SUBMISSION_ROOT}" \
            --campaign-id "${CAMPAIGN_ID}" \
            --phase "${PHASE}" \
            --expected-file-sha256 "${SUBMISSION_SHA256}" >/dev/null
          python -m tools.paired_xben.public_ledger tag \
            --campaign-id "${CAMPAIGN_ID}" --phase "${PHASE}" \
            >"${RUNNER_TEMP}/tag.json"
          jq -r '"tag=" + .tag, "previous_tag=" + (.previous_tag // "")' \
            "${RUNNER_TEMP}/tag.json" >>"${GITHUB_OUTPUT}"

      - name: Require repository-level immutable releases
        env:
          GH_TOKEN: ${{ secrets.PAIRED_XBEN_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "PAIRED_XBEN_ADMIN_READ_TOKEN (Administration: read) is required." >&2
            exit 1
          fi
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            >"${RUNNER_TEMP}/immutable-releases.json"
          jq -e '.enabled == true' "${RUNNER_TEMP}/immutable-releases.json" >/dev/null
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}" >"${RUNNER_TEMP}/repository.json"
          jq -e '.default_branch == "main"' "${RUNNER_TEMP}/repository.json" >/dev/null

      - name: Fetch and verify the immediately preceding immutable receipt
        if: inputs.phase != 'commitment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.validate.outputs.previous_tag }}
          SUBMISSION_ROOT: ${{ runner.temp }}/submission
          PREVIOUS_ROOT: ${{ runner.temp }}/previous
        run: |
          set -euo pipefail
          mkdir -m 700 "${PREVIOUS_ROOT}"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" \
            >"${RUNNER_TEMP}/previous-release.json"
          jq -e --arg tag "${PREVIOUS_TAG}" \
            '.tag_name == $tag and .draft == false and .immutable == true' \
            "${RUNNER_TEMP}/previous-release.json" >/dev/null
          gh release download "${PREVIOUS_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --dir "${PREVIOUS_ROOT}"
          python -m tools.paired_xben.public_ledger verify-entry \
            --entry-dir "${PREVIOUS_ROOT}" \
            --cosign "$(command -v cosign)" \
            --trusted-root "${SUBMISSION_ROOT}/payload/verifiers/sigstore-trusted-root.json" \
            --repository "${GITHUB_REPOSITORY}" >/dev/null

      - name: Atomically reserve the fixed campaign phase tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${GITHUB_SHA}" \
            >"${RUNNER_TEMP}/reserved-ref.json"
          jq -e --arg ref "refs/tags/${RELEASE_TAG}" --arg sha "${GITHUB_SHA}" \
            '.ref == $ref and .object.sha == $sha' \
            "${RUNNER_TEMP}/reserved-ref.json" >/dev/null

      - name: Create a one-use draft release for the reserved tag
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          PHASE: ${{ inputs.phase }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="Paired XBEN ${CAMPAIGN_ID}: ${PHASE}" \
            -f body="Create-only signed benchmark ledger receipt. See ledger-entry.json for scope limits." \
            -F draft=true -F prerelease=true -f make_latest=false \
            >"${RUNNER_TEMP}/draft-release.json"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.tag_name == $tag and .draft == true and .immutable == false' \
            "${RUNNER_TEMP}/draft-release.json" >/dev/null
          jq -r '"release_id=" + (.id | tostring)' \
            "${RUNNER_TEMP}/draft-release.json" >>"${GITHUB_OUTPUT}"
          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            >>"${GITHUB_OUTPUT}"

      - name: Build the source-bound public receipt
        env:
          SUBMISSION_ROOT: ${{ runner.temp }}/submission
          OUTPUT_ROOT: ${{ runner.temp }}/publication
          PREVIOUS_ROOT: ${{ runner.temp }}/previous
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          previous_args=()
          if [ "${PHASE}" != "commitment" ]; then
            previous_args=(--previous-entry "${PREVIOUS_ROOT}/ledger-entry.json")
          fi
          python -m tools.paired_xben.public_ledger prepare-entry \
            --submission-dir "${SUBMISSION_ROOT}" \
            --output-dir "${OUTPUT_ROOT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-id "${GITHUB_REPOSITORY_ID}" \
            --workflow-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor-id "${GITHUB_ACTOR_ID}" \
            --release-id "${RELEASE_ID}" \
            --release-url "${RELEASE_URL}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-head-sha "${SOURCE_RUN_HEAD_SHA}" \
            --source-artifact-name "${SOURCE_ARTIFACT_NAME}" \
            "${previous_args[@]}" >/dev/null

      - name: Generate and validate Sigstore's official signing configuration
        run: |
          set -euo pipefail
          cosign signing-config create --with-default-services \
            --out "${RUNNER_TEMP}/sigstore-signing-config.json"
          python -m tools.paired_xben.public_ledger validate-signing-config \
            --path "${RUNNER_TEMP}/sigstore-signing-config.json" >/dev/null

      - name: Keylessly sign exact bytes with Rekor and the RFC3161 TSA
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/publication
          SUBMISSION_ROOT: ${{ runner.temp }}/submission
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --oidc-provider github-actions \
            --signing-config "${RUNNER_TEMP}/sigstore-signing-config.json" \
            --bundle "${OUTPUT_ROOT}/ledger-entry.sigstore.json" \
            "${OUTPUT_ROOT}/ledger-entry.json" >/dev/null
          if [ "${PHASE}" = "commitment" ]; then
            cosign sign-blob --yes --oidc-provider github-actions \
              --signing-config "${RUNNER_TEMP}/sigstore-signing-config.json" \
              --bundle "${OUTPUT_ROOT}/commitment.sigstore.json" \
              "${OUTPUT_ROOT}/commitment.json" >/dev/null
          fi
          python -m tools.paired_xben.public_ledger verify-entry \
            --entry-dir "${OUTPUT_ROOT}" \
            --cosign "$(command -v cosign)" \
            --trusted-root "${SUBMISSION_ROOT}/payload/verifiers/sigstore-trusted-root.json" \
            --repository "${GITHUB_REPOSITORY}" >/dev/null

      - name: Upload the exact receipt assets without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_ROOT: ${{ runner.temp }}/publication
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          assets=(
            "${OUTPUT_ROOT}/payload.zip"
            "${OUTPUT_ROOT}/ledger-entry.json"
            "${OUTPUT_ROOT}/ledger-entry.sigstore.json"
          )
          if [ "${PHASE}" = "commitment" ]; then
            assets+=(
              "${OUTPUT_ROOT}/commitment.json"
              "${OUTPUT_ROOT}/commitment.sigstore.json"
            )
          fi
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" "${assets[@]}"

      - name: Publish once and require GitHub's immutable-release receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=true -f make_latest=false \
            >"${RUNNER_TEMP}/published-release.json"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.tag_name == $tag and .draft == false and .immutable == true' \
            "${RUNNER_TEMP}/published-release.json" >/dev/null
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            | jq -e --arg sha "${GITHUB_SHA}" '.object.sha == $sha' >/dev/null

      - name: Retain a secondary enumerable workflow receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paired-xben-ledger-${{ inputs.campaign_id }}-${{ inputs.phase }}
          path: ${{ runner.temp }}/publication/*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Publish receipt link in the workflow summary
        env:
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        run: |
          set -euo pipefail
          {
            echo "### Paired XBEN ledger receipt"
            echo
            echo "Immutable release: ${RELEASE_URL}"
            echo
            echo "This receipt proves one published artifact sequence. It does not prove that no alternative campaign or unpublished commitment existed."
          } >>"${GITHUB_STEP_SUMMARY}"
